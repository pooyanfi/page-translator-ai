name: Bug report
description: Something is broken — a page that will not translate, a lost link, a provider error.
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste API keys. If this is a security problem, use
        **Security → Report a vulnerability** instead of this form.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: From the popup footer, or `version` in `manifest.json`.
      placeholder: '1.3.1'
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: 'Brave 1.71 / Chrome 131'
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'macOS 14.5 / Windows 11 / Ubuntu 24.04'
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Google Gemini
        - Ollama (local)
        - OpenAI-compatible endpoint
        - Not applicable / not a provider problem
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model ID
      description: The exact ID from your provider, e.g. `gemini-2.5-flash` or `llama3.1:8b`.
      placeholder: 'gemini-2.5-flash'
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what the extension did instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://example.com/article
        2. Target language: Persian, style: Natural
        3. Click "Translate this page"
        4. ...
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Error text
      description: The banner message, and any service-worker console output. Remove keys and personal data.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am running the latest version from `main`.
          required: true
        - label: I did not include an API key, token or private page content.
          required: true
